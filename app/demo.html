<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Swachta — On-Demand Sanitation</title>
<meta name="description" content="Swachta — India's first on-demand sanitation platform." />
<meta name="theme-color" content="#158263" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
/* === DESIGN SYSTEM === */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#158263;--primary-light:#1a9e78;--dark-green:#1B382C;--deep-forest:#0F2E0D;
  --paper:#F7FCFE;--mint:#F3FAF3;--yellow:#EEC64C;--white:#fff;
  --text:#1F2A20;--text2:#6B7A6D;--text3:#9ca3af;--error:#E5484D;--info:#3B82F6;
  --bg:#F3FAF3;--border:#DCE7DC;--border2:#EDF2ED;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --shadow-card:0 2px 8px rgba(21,130,99,.06);--shadow-btn:0 4px 14px rgba(21,130,99,.25);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
  --ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.175,.885,.32,1.275);
  --max-w:430px;--nav-h:68px;--page-pad:20px;
}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{font:400 .9375rem/1.5 var(--font);color:var(--text);background:#e8ebe9;min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
#root{max-width:var(--max-w);margin:0 auto;background:var(--paper);min-height:100vh;min-height:100dvh;position:relative;overflow-x:hidden;box-shadow:0 0 60px rgba(0,0,0,.08)}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}
button{font-family:var(--font);cursor:pointer;border:none;outline:none;background:none;-webkit-tap-highlight-color:transparent}
input,select{font-family:var(--font);outline:none;border:none}ul{list-style:none}
::-webkit-scrollbar{width:0;height:0}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px 24px;border-radius:28px;font:600 1rem/1 var(--font);transition:all .25s var(--ease);position:relative;overflow:hidden;user-select:none}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5;pointer-events:none}
.btn-primary{background:var(--primary);color:#fff;box-shadow:var(--shadow-btn)}
.btn-primary:hover{background:var(--primary-light)}
.btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn-danger{background:#fff;color:var(--error);border:1.5px solid var(--error)}
.btn-ghost{background:transparent;color:var(--primary);padding:8px 16px;font-weight:500}
.btn-sm{padding:10px 20px;font-size:.875rem;border-radius:16px}

/* Cards */
.card{background:#fff;border-radius:16px;padding:24px;box-shadow:var(--shadow-card)}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;font-size:.75rem;font-weight:600}
.badge-completed{background:#dcfce7;color:#16a34a}.badge-pending{background:#fef3c7;color:#d97706}.badge-cancelled{background:#fee2e2;color:#dc2626}

/* Toggle */
.toggle{width:52px;height:30px;border-radius:15px;background:#d1d5db;position:relative;cursor:pointer;transition:background .3s var(--ease);flex-shrink:0}
.toggle.active{background:var(--primary)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1);transition:transform .3s var(--spring)}
.toggle.active::after{transform:translateX(22px)}

/* Animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounceIn{0%{transform:scale(0)}50%{transform:scale(1.1)}70%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes checkDraw{0%{stroke-dashoffset:48}100%{stroke-dashoffset:0}}
@keyframes ringGrow{0%{transform:scale(.6);opacity:0}50%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes progressFill{from{width:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes leafDrift{0%{opacity:0;transform:translateY(-60px) rotate(0deg)}15%{opacity:.7}50%{transform:translateY(30px) rotate(45deg) translateX(20px)}85%{opacity:.5}100%{opacity:0;transform:translateY(100px) rotate(90deg) translateX(-10px)}}
.anim-fade{animation:fadeIn .4s var(--ease)}.anim-up{animation:fadeUp .5s var(--ease)}.anim-down{animation:fadeDown .4s var(--ease)}
.d1{animation-delay:.05s;animation-fill-mode:both}.d2{animation-delay:.1s;animation-fill-mode:both}.d3{animation-delay:.15s;animation-fill-mode:both}.d4{animation-delay:.2s;animation-fill-mode:both}

/* Page base */
.page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--paper);position:relative}
.page-nav{padding-bottom:var(--nav-h)}
.hidden{display:none!important}

/* ===== SPLASH ===== */
.splash{align-items:center;justify-content:center;overflow:hidden}
.splash::before{content:'';position:absolute;top:-40%;right:-30%;width:80%;height:80%;background:radial-gradient(circle,rgba(21,130,99,.04) 0%,transparent 70%);border-radius:50%}
.splash-inner{display:flex;flex-direction:column;align-items:center;gap:16px;z-index:1}
.splash-truck{width:120px;animation:bounceIn .6s var(--spring);filter:drop-shadow(0 4px 12px rgba(21,130,99,.15))}
.splash-title{font-size:2rem;font-weight:800;letter-spacing:.12em;color:var(--dark-green);animation:fadeUp .5s var(--ease) .3s both}
.splash-tag{font-size:.75rem;color:var(--text2);animation:fadeIn .5s var(--ease) .5s both}
.splash-bar{width:100px;height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:20px;animation:fadeIn .5s var(--ease) .6s both}
.splash-bar-fill{height:100%;width:0;background:var(--primary);border-radius:2px;animation:progressFill 2s var(--ease) .8s forwards}

/* ===== ONBOARDING ===== */
.ob-visual{flex:1;max-height:55vh;overflow:hidden;position:relative;z-index:1;background:var(--mint);display:flex;align-items:center;justify-content:center}
.ob-visual-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:4rem;background:linear-gradient(135deg,rgba(21,130,99,.08),rgba(21,130,99,.02))}
.ob-content{padding:32px var(--page-pad)}
.ob-title{font-size:1.625rem;font-weight:700;color:var(--text);margin-bottom:12px;letter-spacing:-.02em;line-height:1.2}
.ob-desc{font-size:.9375rem;color:var(--text2);line-height:1.6}
.ob-dots{display:flex;align-items:center;justify-content:center;gap:8px;padding:20px 0}
.ob-dot{width:8px;height:8px;border-radius:4px;background:#d1d5db;border:none;padding:0;cursor:pointer;transition:all .25s var(--ease)}
.ob-dot.active{width:28px;background:var(--dark-green)}
.ob-actions{display:flex;gap:16px;padding:0 var(--page-pad);padding-bottom:max(32px,env(safe-area-inset-bottom));z-index:2}
.ob-skip{background:rgba(21,130,99,.06);color:var(--primary);min-width:100px;border-radius:28px}

/* ===== LOGIN / SIGNUP ===== */
.auth{flex-direction:column;background:linear-gradient(180deg,var(--paper) 0%,#e8f5e1 40%,#c8e6b8 80%,rgba(139,195,74,.2) 100%);overflow:hidden}
.auth-leaf{position:absolute;pointer-events:none;z-index:0;opacity:0;animation:leafDrift 8s ease-in-out infinite}
.auth-leaf-1{top:5%;left:10%}.auth-leaf-2{top:2%;right:15%;animation-delay:1.5s}.auth-leaf-3{top:15%;left:60%;animation-delay:3s}
.auth-content{flex:1;display:flex;flex-direction:column;justify-content:center;padding:60px var(--page-pad) 0;position:relative;z-index:1}
.auth-heading{font-size:1.75rem;font-weight:700;color:var(--text);text-align:center;margin-bottom:6px;letter-spacing:-.02em}
.auth-sub{font-size:.9375rem;color:var(--text2);text-align:center;margin-bottom:32px}
.auth-field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.auth-field label{font-size:.8125rem;font-weight:600;color:var(--text)}
.auth-input{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border:1.5px solid var(--border);border-radius:28px;padding:14px 18px;transition:all .25s var(--ease)}
.auth-input:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(21,130,99,.08);background:rgba(255,255,255,.95)}
.auth-input .ic{color:var(--text3);display:flex;flex-shrink:0}
.auth-input input{flex:1;background:none;font-size:.9375rem;color:var(--text)}
.auth-input input::placeholder{color:#b0b8b2}
.auth-terms{font-size:.75rem;color:var(--text2);text-align:center;margin-bottom:24px;line-height:1.5}
.auth-terms a{color:var(--primary);font-weight:500}
.auth-link{text-align:center;font-size:.8125rem;color:var(--text2);margin-bottom:32px}
.auth-link a,.auth-link span{color:var(--primary);font-weight:600;cursor:pointer}
.auth-scenery{position:relative;height:160px;overflow:hidden;margin-top:auto}
.auth-scenery-grad{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(139,195,74,.15) 50%,rgba(76,175,80,.2) 100%)}
.auth-divider{display:flex;align-items:center;gap:16px;color:var(--text3);font-size:.8125rem;margin-bottom:16px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:rgba(0,0,0,.08)}
.auth-social{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.auth-social-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px;border-radius:28px;font-size:.9375rem;font-weight:500;border:1.5px solid var(--border);background:rgba(255,255,255,.85);color:var(--text);cursor:pointer;transition:all .25s}
.auth-social-btn:active{transform:scale(.98)}
.auth-social-btn.apple{background:#111;color:#fff;border-color:#111}

/* ===== OTP ===== */
.otp{flex-direction:column;padding:24px var(--page-pad)}
.otp-back{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text);margin-bottom:24px}
.otp-back:active{background:rgba(0,0,0,.04);transform:scale(.9)}
.otp-illust{display:flex;justify-content:center;margin-bottom:32px}
.otp-illust svg{width:180px;animation:bounceIn .6s var(--spring);filter:drop-shadow(0 4px 12px rgba(21,130,99,.12))}
.otp-heading{font-size:1.625rem;font-weight:700;text-align:center;color:var(--text);margin-bottom:8px}
.otp-sub{font-size:.9375rem;color:var(--text2);text-align:center;margin-bottom:32px;line-height:1.5}
.otp-sub b{font-weight:600;color:var(--text)}
.otp-boxes{display:flex;gap:16px;justify-content:center;margin-bottom:32px}
.otp-box{width:56px;height:56px;border-radius:12px;border:1.5px solid var(--border);background:rgba(243,250,243,.5);font-size:1.5rem;font-weight:700;text-align:center;color:var(--dark-green);transition:all .25s var(--ease);caret-color:var(--primary)}
.otp-box:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(21,130,99,.1);background:#fff}
.otp-box.filled{border-color:var(--primary);background:rgba(21,130,99,.04)}
.otp-resend{text-align:center;font-size:.9375rem;color:var(--text2)}
.otp-resend-btn{color:var(--primary);font-weight:600;text-decoration:underline;cursor:pointer;background:none;border:none;font-size:.9375rem;font-family:var(--font)}

/* ===== VERIFIED ===== */
.verified{align-items:center;justify-content:center;padding:var(--page-pad);text-align:center}
.verified-ring{width:120px;height:120px;border-radius:50%;background:rgba(21,130,99,.08);display:flex;align-items:center;justify-content:center;margin-bottom:32px;position:relative;animation:ringGrow .5s var(--spring)}
.verified-ring::before{content:'';position:absolute;inset:-12px;border-radius:50%;background:rgba(21,130,99,.04);animation:ringGrow .6s var(--spring) .1s both}
.verified-check{width:60px;height:60px;z-index:1}
.verified-check path{stroke-dasharray:48;stroke-dashoffset:48;animation:checkDraw .5s var(--ease) .5s forwards}
.verified-title{font-size:1.5rem;font-weight:700;color:var(--text);margin-bottom:8px}
.verified-sub{font-size:.9375rem;color:var(--text2);margin-bottom:48px;max-width:260px;line-height:1.5}
.verified-btns{width:100%;display:flex;flex-direction:column;gap:16px}

/* ===== LOCATION ===== */
.location{align-items:center;justify-content:center;padding:var(--page-pad);text-align:center}
.location-icon{width:100px;height:100px;border-radius:50%;background:rgba(21,130,99,.08);display:flex;align-items:center;justify-content:center;margin-bottom:32px;animation:bounceIn .5s var(--spring)}
.location-icon svg{width:48px;height:48px;color:var(--dark-green)}
.location-title{font-size:1.375rem;font-weight:700;color:var(--text);margin-bottom:12px}
.location-desc{font-size:.9375rem;color:var(--text2);max-width:280px;margin:0 auto 48px;line-height:1.5}
.location-btns{width:100%;display:flex;flex-direction:column;gap:16px}
.location-or{display:flex;align-items:center;gap:16px;color:var(--text3);font-size:.8125rem}
.location-or::before,.location-or::after{content:'';flex:1;height:1px;background:var(--border)}

/* ===== HOME ===== */
.home-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px var(--page-pad);padding-top:20px}
.home-loc{display:flex;flex-direction:column;cursor:pointer}
.home-loc-lbl{font-size:.6875rem;color:var(--text3);font-weight:500;letter-spacing:.02em}
.home-loc-val{display:flex;align-items:center;gap:4px;font-size:.9375rem;font-weight:700;color:var(--text)}
.home-avatar{width:40px;height:40px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.875rem;cursor:pointer}
.home-avatar:active{transform:scale(.9)}
.home-search{margin:8px var(--page-pad) 16px;display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--border);border-radius:28px;padding:12px 16px}
.home-search .ic{color:var(--text3);display:flex;flex-shrink:0}
.home-search input{flex:1;background:none;font-size:.875rem;color:var(--text)}
.home-search input::placeholder{color:var(--text3)}
.home-cam{width:36px;height:36px;border-radius:12px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;flex-shrink:0}
.home-cam:active{transform:scale(.9)}
.home-sec{padding:8px var(--page-pad) 16px}
.home-sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.home-sec-title{font-size:1.125rem;font-weight:600;color:var(--text)}
.home-sec-link{font-size:.8125rem;font-weight:600;color:var(--primary);cursor:pointer}
.home-offers{display:flex;gap:16px;overflow-x:auto;padding:0 var(--page-pad);scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-bottom:8px}
.home-offers::-webkit-scrollbar{display:none}
.home-offer{min-width:85%;border-radius:20px;overflow:hidden;scroll-snap-align:start;position:relative;aspect-ratio:16/8;flex-shrink:0;background:linear-gradient(135deg,rgba(27,56,44,.85),rgba(21,130,99,.5))}
.home-offer-inner{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:24px}
.home-offer-t{font-size:1.125rem;font-weight:700;color:#fff;margin-bottom:4px}
.home-offer-d{font-size:.8125rem;color:rgba(255,255,255,.8)}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.home-svc{border-radius:16px;overflow:hidden;position:relative;aspect-ratio:1;cursor:pointer;transition:transform .15s;background:linear-gradient(135deg,rgba(21,130,99,.15),rgba(21,130,99,.05));display:flex;align-items:center;justify-content:center}
.home-svc:active{transform:scale(.97)}
.home-svc-emoji{font-size:2.5rem;margin-bottom:28px}
.home-svc-lbl{position:absolute;bottom:0;left:0;right:0;padding:12px 14px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:.8125rem;font-weight:600}
.home-plant{margin:8px var(--page-pad);background:linear-gradient(135deg,#e8f5e9,#f1f8e9);border-radius:20px;padding:24px;display:flex;align-items:center;gap:20px;position:relative;overflow:hidden}
.home-plant::after{content:'';position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;background:rgba(21,130,99,.06);border-radius:50%}
.home-plant-ic{width:56px;height:56px;border-radius:16px;background:rgba(21,130,99,.12);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
.home-plant-c{flex:1;z-index:1}.home-plant-c h3{font-size:.9375rem;font-weight:600;color:var(--text);margin-bottom:4px}
.home-plant-c p{font-size:.8125rem;color:var(--text2);margin-bottom:12px}
.home-plant-btn{display:inline-flex;align-items:center;gap:4px;padding:8px 18px;background:var(--primary);color:#fff;border-radius:999px;font-size:.8125rem;font-weight:600;cursor:pointer;border:none}
.home-plant-btn:active{transform:scale(.96)}
.home-refer{margin:8px var(--page-pad);background:linear-gradient(135deg,#158263,#1B382C);border-radius:20px;padding:24px;display:flex;align-items:center;justify-content:space-between;gap:20px;color:#fff;position:relative;overflow:hidden}
.home-refer::before{content:'';position:absolute;right:-20px;top:-20px;width:100px;height:100px;background:rgba(255,255,255,.06);border-radius:50%}
.home-refer h3{font-size:1.125rem;font-weight:700;margin-bottom:4px}
.home-refer p{font-size:.8125rem;opacity:.8;margin-bottom:12px}
.home-refer-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:#fff;color:var(--dark-green);border-radius:999px;font-size:.8125rem;font-weight:700;cursor:pointer;border:none}
.home-refer-btn:active{transform:scale(.96)}
.home-refer-emoji{font-size:3rem;flex-shrink:0}
.home-footer{padding:48px var(--page-pad);text-align:center}
.home-footer-tag{font-size:.8125rem;color:var(--text3);letter-spacing:.02em;margin-bottom:8px;line-height:1.6}
.home-footer-name{font-size:1.25rem;font-weight:800;letter-spacing:.12em;color:var(--dark-green);margin-bottom:4px}
.home-footer-trust{font-size:.6875rem;color:var(--text3)}

/* ===== BOTTOM NAV ===== */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--max-w);height:var(--nav-h);background:#fff;border-top:1px solid var(--border2);display:flex;align-items:center;justify-content:space-around;padding:0 8px;z-index:100;box-shadow:0 -2px 12px rgba(0,0,0,.04)}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 12px;border-radius:16px;cursor:pointer;transition:all .25s var(--ease);min-width:56px}
.bnav-item:active{transform:scale(.9)}
.bnav-item.active{background:rgba(21,130,99,.08)}
.bnav-ic{width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:color .25s}
.bnav-item.active .bnav-ic{color:var(--primary)}
.bnav-lbl{font-size:.625rem;font-weight:500;color:var(--text3);letter-spacing:.01em;transition:color .25s}
.bnav-item.active .bnav-lbl{color:var(--primary);font-weight:600}

/* ===== SERVICE PAGE ===== */
.svc-hdr{background:linear-gradient(135deg,#158263,#1a9e78 40%,#158263);color:#fff;padding:24px var(--page-pad);padding-top:32px;border-radius:0 0 20px 20px;display:flex;align-items:center;gap:16px;position:relative;overflow:hidden}
.svc-hdr::after{content:'';position:absolute;top:-20px;right:-15px;width:110px;height:110px;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%);border-radius:50%}
.svc-back{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.svc-back:active{transform:scale(.9)}
.svc-hdr-title{font-size:1.25rem;font-weight:700;flex:1}
.svc-hdr-price{background:#fff;color:var(--dark-green);padding:6px 16px;border-radius:12px;font-size:.875rem;font-weight:700}
.svc-content{padding:24px var(--page-pad);flex:1;display:flex;flex-direction:column;gap:20px}
.svc-loc{background:#fff;border-radius:16px;padding:24px;box-shadow:var(--shadow-card);display:flex;align-items:flex-start;gap:16px}
.svc-loc-ic{width:36px;height:36px;border-radius:50%;background:rgba(21,130,99,.1);display:flex;align-items:center;justify-content:center;color:var(--primary);flex-shrink:0}
.svc-loc-lbl{font-size:.75rem;color:var(--text3);margin-bottom:4px}
.svc-loc-addr{font-size:.9375rem;color:var(--text);line-height:1.5}
.svc-option{background:#fff;border-radius:16px;padding:24px;box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:space-between}
.svc-option h3{font-size:.9375rem;font-weight:600;color:var(--text);margin-bottom:4px}

  otp: () => `<div class="page otp"><button class="otp-back" onclick="nav('login')">${backSvg}</button><div class="otp-illust">${truckSvg}</div><h1 class="otp-heading">Enter OTP</h1><p class="otp-sub">We've sent a code to<br/><b>+91 98765 43210</b></p><div class="otp-boxes"><input class="otp-box" type="tel" maxlength="1" inputmode="numeric" value="1" readonly/><input class="otp-box filled" type="tel" maxlength="1" inputmode="numeric" value="2" readonly/><input class="otp-box filled" type="tel" maxlength="1" inputmode="numeric" value="3" readonly/><input class="otp-box filled" type="tel" maxlength="1" inputmode="numeric" value="4" readonly/></div><div style="margin-bottom:20px"><button class="btn btn-primary" onclick="nav('verified')">Verify OTP</button></div><div class="otp-resend"><span style="color:var(--text3);font-size:.8125rem">Resend OTP in 30s</span></div></div>`,

  location: () => `<div class="page location"><div class="location-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div><h1 class="location-title">Enable Location Access</h1><p class="location-desc">We need your location to provide the best waste collection service in your area</p><div class="location-btns"><button class="btn btn-primary" onclick="nav('home')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>Detect My Location</button><div class="location-or">or</div><button class="btn btn-outline" onclick="nav('home')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>Enter Location Manually</button></div></div>`,
  home: () => `<div class="page page-nav"><div class="home-hdr anim-down"><div class="home-loc" onclick="nav('location')"><span class="home-loc-lbl">Current Location</span><span class="home-loc-val">${state.location.area}, ${state.location.city} <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></span></div><div class="home-avatar" onclick="nav('profile')">${initials}</div></div><div class="home-search anim-up d1"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span><input type="text" placeholder="Search services..." readonly/><div class="home-cam" onclick="nav('camera')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></div></div><div class="home-sec-hdr" style="padding:0 20px;margin-top:8px"><h2 class="home-sec-title">Special Offers</h2><span class="home-sec-link">See more</span></div><div class="home-offers anim-up d2" style="margin-top:12px"><div class="home-offer"><div class="home-offer-inner"><span class="home-offer-t">First Pickup Free!</span><span class="home-offer-d">Book your first garbage pickup for free. Limited time.</span></div></div><div class="home-offer" style="background:linear-gradient(135deg,rgba(21,130,99,.95),rgba(27,56,44,.9))"><div class="home-offer-inner"><span class="home-offer-t">Refer & Earn ₹100</span><span class="home-offer-d">Invite friends and earn credits on every booking.</span></div></div></div><div class="home-sec anim-up d3"><div class="home-sec-hdr"><h2 class="home-sec-title">Our Services</h2></div><div class="home-grid"><div class="home-svc" onclick="nav('daily')"><div class="home-svc-emoji">🗑️</div><div class="home-svc-lbl">Daily Garbage</div></div><div class="home-svc" onclick="nav('scrap')"><div class="home-svc-emoji">📦</div><div class="home-svc-lbl">Scrap Materials</div></div><div class="home-svc" onclick="nav('recyclable')"><div class="home-svc-emoji">♻️</div><div class="home-svc-lbl">Recyclable Waste</div></div><div class="home-svc" onclick="nav('large')"><div class="home-svc-emoji">🚛</div><div class="home-svc-lbl">Large Dump</div></div></div></div><div class="home-plant anim-up d4"><div class="home-plant-ic">🌱</div><div class="home-plant-c"><h3>Planting Made Effortless</h3><p>Plant trees with every pickup. Track your forest.</p><button class="home-plant-btn" onclick="nav('impact')">Plant Now →</button></div></div><div class="home-refer"><div><h3>Refer & Earn</h3><p>Share your code with friends and earn rewards</p><button class="home-refer-btn" onclick="nav('rewards')">SEND CODE →</button></div><div class="home-refer-emoji">🤝</div></div><div class="home-footer"><p class="home-footer-tag">every piece <b>RECYCLED</b>,<br/>every future <b>PROTECTED</b></p><p class="home-footer-name">SWACHTA</p><p class="home-footer-trust">Trusted by 200k+ Eco-Warriors</p></div>${bottomNav('home')}</div>`,
  daily: () => `<div class="page"><div class="svc-hdr"><button class="svc-back" onclick="nav('home')">${backSvg}</button><h1 class="svc-hdr-title">Daily Garbage</h1></div><div class="svc-content"><div class="svc-loc anim-up"><div class="svc-loc-ic">${pinSvg}</div><div><span class="svc-loc-lbl">Pickup Location</span><p class="svc-loc-addr">${state.location.full}</p></div></div><div class="svc-tabs anim-up d1"><div class="svc-tab ${state.svcTab==='instant'?'active':''}" onclick="state.svcTab='instant';render()">Instant Service</div><div class="svc-tab ${state.svcTab==='recurring'?'active':''}" onclick="state.svcTab='recurring';render()">Recurring Plans</div></div><div class="svc-option anim-up d2"><div><h3>One-time Service</h3><div class="svc-option-time">${clockSvg} 45-60 min</div></div><div class="svc-option-price">₹149</div></div></div><div class="svc-bottom"><button class="btn btn-primary" onclick="nav('confirmed')" style="flex:1">Book Service</button></div></div>`,
  large: () => `<div class="page"><div class="svc-hdr"><button class="svc-back" onclick="nav('home')">${backSvg}</button><h1 class="svc-hdr-title">Large Dump</h1><div class="svc-hdr-price">₹ 499</div></div><div class="svc-content"><div class="svc-loc anim-up"><div class="svc-loc-ic">${pinSvg}</div><div><span class="svc-loc-lbl">Pickup Location</span><p class="svc-loc-addr">${state.location.full}</p></div></div><div class="svc-option anim-up d1"><div><h3>One-time Pickup</h3><div class="svc-option-time">${clockSvg} 45-60 min</div></div><div class="svc-option-price">₹499</div></div></div><div class="svc-bottom"><button class="btn btn-primary" onclick="nav('confirmed')" style="flex:1">Proceed to pay ₹499</button></div></div>`,
  scrap: () => `<div class="page"><div class="svc-hdr"><button class="svc-back" onclick="nav('home')">${backSvg}</button><h1 class="svc-hdr-title">Scrap Items</h1></div><div class="svc-content"><div class="svc-loc anim-up"><div class="svc-loc-ic">${pinSvg}</div><div><span class="svc-loc-lbl">Pickup Location</span><p class="svc-loc-addr">${state.location.full}</p></div></div><div class="card anim-up d1"><div style="display:flex;align-items:center;gap:12px;margin-bottom:16px"><div style="width:36px;height:36px;border-radius:8px;background:rgba(21,130,99,.1);display:flex;align-items:center;justify-content:center;color:var(--primary)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></div><div><div style="font-weight:600;font-size:.9375rem">Detected Materials</div><div style="font-size:.8125rem;color:var(--text2)">Review detected items</div></div></div>${[{n:'Plastic Bottles',c:'95%',i:'♻️'},{n:'Cardboard',c:'92%',i:'📦'},{n:'Aluminum Cans',c:'88%',i:'🥫'},{n:'Newspapers',c:'85%',i:'📰'},{n:'Electronics',c:'78%',i:'💻'}].map(m=>`<div style="display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border2)"><div style="width:40px;height:40px;border-radius:12px;background:rgba(21,130,99,.08);display:flex;align-items:center;justify-content:center;font-size:1rem">${m.i}</div><div style="flex:1"><div style="font-weight:600;font-size:.875rem">${m.n}</div><div style="font-size:.75rem;color:var(--primary)">${m.c} confident</div></div></div>`).join('')}<div style="display:flex;align-items:center;justify-content:space-between;padding:20px 0 0;border-top:1px solid var(--border2);margin-top:8px"><span style="color:var(--text2)">Total Estimated Value</span><span style="font-size:1.5rem;font-weight:700;color:var(--primary)">₹430</span></div></div></div><div class="svc-bottom"><button class="btn btn-primary" onclick="nav('confirmed')" style="flex:1">Book Service</button></div></div>`,
  recyclable: () => `<div class="page"><div class="svc-hdr"><button class="svc-back" onclick="nav('home')">${backSvg}</button><h1 class="svc-hdr-title">Recyclable Waste</h1></div><div class="svc-content"><div class="svc-loc anim-up"><div class="svc-loc-ic">${pinSvg}</div><div><span class="svc-loc-lbl">Pickup Location</span><p class="svc-loc-addr">${state.location.full}</p></div></div><div class="card anim-up d1">${[{n:'Plastic',i:'♻️',s:true},{n:'Glass',i:'🫙',s:true},{n:'Metal',i:'🥫',s:false},{n:'Paper',i:'📄',s:false}].map(c=>`<div style="display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border2);cursor:pointer"><div style="width:40px;height:40px;border-radius:12px;background:rgba(21,130,99,.08);display:flex;align-items:center;justify-content:center;font-size:1rem">${c.i}</div><div style="flex:1;font-weight:600;font-size:.875rem">${c.n}</div><div style="width:24px;height:24px;border-radius:6px;border:2px solid ${c.s?'#158263':'#dce7dc'};background:${c.s?'#158263':'#fff'};display:flex;align-items:center;justify-content:center">${c.s?`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>`:''}</div></div>`).join('')}</div><div class="svc-option anim-up d2"><div><h3>One-time Pickup</h3><div class="svc-option-time">${clockSvg} 30-45 min</div></div><div class="svc-option-price">₹99</div></div></div><div class="svc-bottom"><button class="btn btn-primary" onclick="nav('confirmed')" style="flex:1">Book Pickup</button></div></div>`,
  camera: () => `<div class="page" style="background:#111;min-height:100vh"><div style="position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:24px var(--page-pad);padding-top:32px;z-index:10"><button style="width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;border:none" onclick="nav('home')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button><button style="width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;border:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></button></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--page-pad);min-height:70vh"><div style="background:rgba(0,0,0,.55);backdrop-filter:blur(12px);border-radius:20px;padding:32px;text-align:center;max-width:300px;animation:bounceIn .4s var(--spring)"><div style="color:var(--primary);margin-bottom:16px"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></div><h2 style="font-size:1.125rem;font-weight:700;color:#fff;margin-bottom:8px">Click Image of Your Garbage</h2><p style="font-size:.8125rem;color:rgba(255,255,255,.7);line-height:1.5">We'll analyze it to determine the right vehicle</p></div></div><div style="display:flex;align-items:center;justify-content:center;padding:32px;gap:48px"><div style="width:44px;height:44px;border-radius:12px;background:rgba(2   confirmed: () => `<div class="page conf"><div class="conf-ring"><svg class="conf-check" viewBox="0 0 60 60" fill="none"><circle cx="30" cy="30" r="28" fill="rgba(21,130,99,.1)" stroke="#158263" stroke-width="2"/><path d="M18 30L26 38L42 22" stroke="#158263" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div><h1 class="conf-title anim-up">Booking Confirmed!</h1><p class="conf-sub anim-up d1">Your waste collection service has been successfully booked</p><div class="conf-details anim-up d2"><h3>Booking Details</h3><div class="conf-row"><div class="conf-row-ic">📋</div><div><div class="conf-row-lbl">Service</div><div class="conf-row-val">Daily Garbage - One-time</div></div></div><div class="conf-row"><div class="conf-row-ic">🕐</div><div><div class="conf-row-lbl">Date & Time</div><div class="conf-row-val">Jul 21, 2026 • 6-8 AM</div></div></div><div class="conf-row"><div class="conf-row-ic">📍</div><div><div class="conf-row-lbl">Location</div><div class="conf-row-val">Sec - 76, Noida</div></div></div><div class="conf-row"><div class="conf-row-ic">₹</div><div><div class="conf-row-lbl">Amount Paid</div><div class="conf-row-val">₹149</div></div></div></div><div class="conf-actions"><button class="btn btn-outline">Download Receipt</button><button class="conf-home" onclick="nav('home')">🏠 Go to Home</button></div></div>`,
  bookings: () => { const filters=['All','Ongoing','Completed','Cancelled']; const filtered=state.bkFilter==='All'?state.bookings:state.bookings.filter(b=>b.status===state.bkFilter); return `<div class="page page-nav"><div class="bk-hdr anim-down"><div class="bk-hdr-left"><button class="sub-back" onclick="nav('home')">${backSvg}</button><div><h1>My Bookings</h1><p>Track your orders</p></div></div></div><div class="bk-chips">${filters.map(f=>`<button class="bk-chip ${state.bkFilter===f?'active':''}" onclick="state.bkFilter='${f}';render()">${f}</button>`).join('')}</div><div class="bk-list">${filtered.length===0?'<div style="text-align:center;padding:48px;color:var(--text3)"><p>No bookings found</p></div>':filtered.map(b=>`<div class="bk-card anim-up"><div><h3>${b.service}</h3><span class="bk-card-price">${b.earned?'+ ':''}₹${Math.abs(b.price).toLocaleString()}</span></div><div class="bk-card-right"><span class="badge badge-${b.status.toLowerCase()}">${b.status}</span><div class="bk-card-date">${b.date}</div></div></div>`).join('')}</div>${bottomNav('bookings')}</div>`; },
  impact: () => { const pct=Math.min((state.user.impactPoints/2000)*100,100); return `<div class="page page-nav"><div class="impact-hdr"><div class="impact-row"><h1 style="font-size:1.25rem;font-weight:700">My Impact</h1><div class="impact-credits"><span>🍃</span><span>${state.user.carbonCredits.toLocaleString()} Credits</span></div></div><div class="impact-level"><div class="impact-tree">🌳</div><h2 class="impact-lvl-name">${state.user.impactLevel}</h2><p class="impact-lvl-desc">Growing your green footprint</p><div class="impact-prog"><div class="impact-prog-bar"><div class="impact-prog-fill" style="width:${pct}%"></div></div><div class="impact-prog-labels"><span>${state.user.impactPoints} pts</span><span>2,000 pts</span></div></div></div></div><div class="impact-stats"><div class="impact-stat anim-up d1"><div class="impact-stat-val">${state.user.treesPlanted}</div><div class="impact-stat-lbl">Trees Planted</div></div><div class="impact-stat anim-up d2"><div class="impact-stat-val">${state.user.wasteRecycled} kg</div><div class="impact-stat-lbl">Recycled</div></div><div class="impact-stat anim-up d3"><div class="impact-stat-val">${state.user.co2Prevented} kg</div><div class="impact-stat-lbl">CO₂ Saved</div></div></div><div class="impact-milestones"><h3 class="impact-ms-title">Milestones</h3>${[{n:'First Pickup',d:'Complete your first garbage pickup',i:'🚛',done:true,c:'green'},{n:'Eco Warrior',d:'Recycle 50 kg of waste',i:'♻️',done:true,c:'green'},{n:'Tree Planter',d:'Plant your first tree',i:'🌱',done:true,c:'green'},{n:'Community Hero',d:'Refer 5 friends',i:'👥',done:false,c:'amber'},{n:'Carbon Neutral',d:'Offset 100 kg CO₂',i:'🌍',done:false,c:'gray'}].map(m=>`<div class="impact-ms"><div class="impact-ms-ic ${m.c}">${m.i}</div><div class="impact-ms-info"><div class="impact-ms-name">${m.n}</div><div class="impact-ms-desc">${m.d}</div></div><div class="impact-ms-chk ${m.done?'done':'pending'}">${m.done?checkSvg14:''}</div></div>`).join('')}</div>${bottomNav('impact')}</div>`; },

nt-weight:600;color:${h.a.startsWith('-')?'var(--error)':'var(--primary)'}">${h.a}</div></div>`).join('')}</div></div>`,

  about: () => `<div class="page"><div class="sub-hdr"><button class="sub-back" onclick="nav('profile')">${backSvg}</button><h1 class="sub-title">About</h1></div><div class="sub-content"><div class="card anim-up" style="text-align:center"><div style="font-size:1.5rem;font-weight:800;color:var(--dark-green);letter-spacing:.1em;margin-bottom:8px">SWACHTA</div><div style="font-size:.75rem;color:var(--text3);margin-bottom:24px">Version 1.0.0 (Pilot)</div><p style="color:var(--text2);line-height:1.6;margin-bottom:16px">India's first on-demand sanitation platform, connecting trained workers with households for eco-friendly waste management.</p><p style="color:var(--text2);line-height:1.6">Founded by <b>Shivam Yadav</b></p></div><div style="text-align:center;padding:24px 0"><p style="font-size:.75rem;color:var(--text3);line-height:1.6">Made with 💚 in India<br/>© 2025 Swachta. All rights reserved.</p></div></div></div>`,
  security: () => `<div class="page"><div class="sub-hdr"><button class="sub-back" onclick="nav('profile')">${backSvg}</button><h1 class="sub-title">Account & Security</h1></div><div class="sub-content"><div style="font-size:.6875rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:8px 0">AUTHENTICATION</div>${[{l:'Biometric Login',d:'Use fingerprint or face ID',on:true},{l:'Two-Factor Auth',d:'Extra layer of security',on:false}].map(r=>`<div style="display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--border2)"><div style="width:40px;height:40px;border-radius:12px;background:var(--mint);display:flex;align-items:center;justify-content:center;color:var(--text2)">🔒</div><div style="flex:1"><div style="font-weight:500">${r.l}</div><div style="font-size:.75rem;color:var(--text3)">${r.d}</div></div><div class="toggle ${r.on?'active':''}" onclick="this.classList.toggle('active')"></div></div>`).join('')}<div style="font-size:.6875rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:8px 0;margin-top:16px">NOTIFICATIONS</div><div style="display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--border2)"><div style="width:40px;height:40px;border-radius:12px;background:var(--mint);display:flex;align-items:center;justify-content:center;color:var(--text2)">🔔</div><div style="flex:1"><div style="font-weight:500">Push Notifications</div><div style="font-size:.75rem;color:var(--text3)">Booking updates & offers</div></div><div class="toggle active" onclick="this.classList.toggle('active')"></div></div></div></div>`,
  delete: () => `<div class="page"><div class="sub-hdr"><button class="sub-back" onclick="nav('profile')">${backSvg}</button><h1 class="sub-title">Delete Account</h1></div><div class="sub-content"><div style="background:rgba(229,72,77,.05);border:1px solid rgba(229,72,77,.15);border-radius:16px;padding:24px" class="anim-up"><h3 style="font-weight:600;color:var(--error);margin-bottom:8px">⚠️ This action is permanent</h3><p style="font-size:.8125rem;color:var(--text2);line-height:1.5">Deleting your account will:</p><ul style="margin-top:12px;font-size:.8125rem;color:var(--text2)">${['Remove all personal data','Cancel pending bookings','Forfeit carbon credits','Delete saved addresses'].map(i=>`<li style="padding:4px 0;display:flex;align-items:center;gap:8px"><span style="color:var(--error);font-weight:bold">•</span>${i}</li>`).join('')}</ul></div><button class="btn btn-danger" style="margin-top:8px" onclick="nav('splash')">Delete My Account</button><button class="btn btn-ghost" onclick="nav('profile')">Cancel</button></div></div>`,

function render() {
  const root = document.getElementById('root');
  const fn = pages[state.page];
  if (fn) root.innerHTML = fn();
  root.scrollTop = 0;
}

render();
</script>
